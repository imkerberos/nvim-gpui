# Contract for a staged, application-private Rime runtime.
#
# This file describes the artifact layout and the source revision used by the
# platform builders. It does not contain platform binaries or user data.

[source]
repository = "https://github.com/rime/librime.git"
version = "1.16.1"
revision = "5d7467d037938a17abb394f560f016adc9f76e14"

[layout]
version = 1
library_directory = "lib"
data_directory = "data"
modules_directory = "modules"

[platform.macos]
library_names = ["librime.dylib", "librime.1.dylib"]

[platform.windows]
library_names = ["rime.dll", "librime.dll"]

[platform.linux]
library_names = ["librime.so", "librime.so.1"]
