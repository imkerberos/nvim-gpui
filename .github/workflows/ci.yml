name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (macOS)
    # Determinate Nix currently supports macOS on Apple Silicon. Keep this
    # label explicit instead of following macos-latest to a future image.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run repository checks
        run: nix develop --accept-flake-config .#devShells.aarch64-darwin.default -c just ci

      - name: Build and verify macOS AppBundle
        run: nix develop --accept-flake-config .#devShells.aarch64-darwin.default -c just bundle
