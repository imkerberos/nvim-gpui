name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEOVIM_VERSION: 0.12.5

jobs:
  nix-checks:
    name: Checks (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS aarch64
            runner: macos-15
            nix_system: aarch64-darwin
          - name: Linux x86_64
            runner: ubuntu-24.04
            nix_system: x86_64-linux
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            nix_system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-${{ matrix.nix_system }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: |
            cargo-${{ matrix.nix_system }}-

      - name: Run checks and macOS package validation
        if: matrix.nix_system == 'aarch64-darwin'
        run: nix develop --accept-flake-config ".#devShells.${{ matrix.nix_system }}.default" -c just pack-macos

      - name: Run Linux checks
        if: matrix.nix_system != 'aarch64-darwin'
        run: nix develop --accept-flake-config ".#devShells.${{ matrix.nix_system }}.default" -c just ci

  windows-checks:
    name: Checks (Windows x86_64)
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-windows-x86_64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-windows-x86_64-

      - name: Install Rust components
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          cargo install just --locked

      - name: Install pinned Neovim
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "nvim-$env:NEOVIM_VERSION"
          $nvimBin = Join-Path $installDir 'bin'
          $nvimExe = Join-Path $nvimBin 'nvim.exe'
          $archive = Join-Path $env:RUNNER_TEMP "nvim-$env:NEOVIM_VERSION.zip"
          if (-not (Test-Path $nvimExe)) {
            Invoke-WebRequest `
              -Uri "https://github.com/neovim/neovim/releases/download/v$env:NEOVIM_VERSION/nvim-win64.zip" `
              -OutFile $archive
            if (Test-Path $installDir) {
              Remove-Item $installDir -Recurse -Force
            }
            Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
            Rename-Item (Join-Path $env:RUNNER_TEMP 'nvim-win64') $installDir
          }
          if (-not (Test-Path $nvimExe)) {
            throw "Neovim executable was not found: $nvimExe"
          }
          $nvimBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nvimExe --version

      - name: Run repository checks
        shell: pwsh
        run: just ci
