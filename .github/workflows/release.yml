name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEOVIM_VERSION: 0.12.5

jobs:
  macos:
    name: macOS ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            nix_system: aarch64-darwin
          - arch: x86_64
            # Determinate Nix no longer installs on Intel macOS. Build the
            # Intel artifact on Apple Silicon and let macOS/Rosetta execute
            # any x86_64 tools that are needed during the build.
            runner: macos-15
            nix_system: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release metadata
        run: python3 scripts/release.py check "$GITHUB_REF_NAME"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache Cargo and Rime build data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            .cache/rime-build/macos
          key: macos-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'packaging/rime/runtime.toml', 'packaging/rime/starter-data.toml') }}
          restore-keys: |
            macos-${{ matrix.arch }}-

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"

      - name: Enable Rosetta 2 for Intel tools
        if: matrix.arch == 'x86_64'
        run: sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license

      - name: Build, test, and package macOS
        env:
          NVIM_GPUI_PACKAGE_ARCH: ${{ matrix.arch }}
        run: nix develop --accept-flake-config ".#devShells.${{ matrix.nix_system }}.default" -c just pack-macos

      - name: Archive AppBundle
        env:
          ARCH: ${{ matrix.arch }}
        run: ditto -c -k --sequesterRsrc --keepParent ".cache/macos/nvim-gpui.app" ".cache/macos/nvim-gpui-${ARCH}.app.zip"

      - name: Prepare macOS release assets
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cp \
            ".cache/macos/nvim-gpui-${ARCH}.dmg" \
            "nvim-gpui-${GITHUB_REF_NAME}-darwin-${ARCH}.dmg"
          cp \
            ".cache/macos/nvim-gpui-${ARCH}.app.zip" \
            "nvim-gpui-${GITHUB_REF_NAME}-darwin-${ARCH}.app.zip"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: nvim-gpui-${{ github.ref_name }}-darwin-${{ matrix.arch }}
          path: |
            nvim-gpui-${{ github.ref_name }}-darwin-${{ matrix.arch }}.dmg
            nvim-gpui-${{ github.ref_name }}-darwin-${{ matrix.arch }}.app.zip
          if-no-files-found: error
          include-hidden-files: false

  linux:
    name: Linux ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            nix_system: x86_64-linux
          - arch: aarch64
            runner: ubuntu-24.04-arm
            nix_system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release metadata
        run: python3 scripts/release.py check "$GITHUB_REF_NAME"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: release-cargo-${{ matrix.nix_system }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: |
            release-cargo-${{ matrix.nix_system }}-

      - name: Build and test Linux release
        run: nix develop --accept-flake-config ".#devShells.${{ matrix.nix_system }}.default" -c just ci

      - name: Build Linux release binaries
        run: nix develop --accept-flake-config ".#devShells.${{ matrix.nix_system }}.default" -c just build-release

      - name: Build Ubuntu package
        run: |
          nix develop --accept-flake-config ".#devShells.${{ matrix.nix_system }}.default" -c just pack-linux-${{ matrix.arch }}
          package="$(find "dist/ubuntu-${{ matrix.arch }}" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          cp "$package" "nvim-gpui-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.deb"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: nvim-gpui-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: nvim-gpui-${{ github.ref_name }}-linux-${{ matrix.arch }}.deb
          if-no-files-found: error

  windows:
    name: Windows x86_64 package
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release metadata
        shell: pwsh
        run: python scripts/release.py check $env:GITHUB_REF_NAME

      - name: Cache Cargo and Rime build data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            .cache/rime-build/windows-x86_64
          key: windows-x86_64-${{ hashFiles('Cargo.lock', 'packaging/rime/runtime.toml', 'packaging/rime/starter-data.toml') }}
          restore-keys: |
            windows-x86_64-

      - name: Install Rust components and just
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt
          cargo install just --locked
          (Join-Path $env:USERPROFILE '.cargo\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command choco.exe -ErrorAction SilentlyContinue)) {
            throw 'Chocolatey is not available on the Windows runner'
          }
          choco.exe install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Chocolatey failed to install Inno Setup with exit code $LASTEXITCODE"
          }

          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $iscc) {
            throw 'Inno Setup was installed but ISCC.exe was not found'
          }
          "INNO_SETUP_COMPILER=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "using ISCC: $iscc"

      - name: Install pinned Neovim
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "nvim-$env:NEOVIM_VERSION"
          $nvimBin = Join-Path $installDir 'bin'
          $nvimExe = Join-Path $nvimBin 'nvim.exe'
          $archive = Join-Path $env:RUNNER_TEMP "nvim-$env:NEOVIM_VERSION.zip"
          if (-not (Test-Path $nvimExe)) {
            Invoke-WebRequest `
              -Uri "https://github.com/neovim/neovim/releases/download/v$env:NEOVIM_VERSION/nvim-win64.zip" `
              -OutFile $archive
            if (Test-Path $installDir) {
              Remove-Item $installDir -Recurse -Force
            }
            Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
            Rename-Item (Join-Path $env:RUNNER_TEMP 'nvim-win64') $installDir
          }
          if (-not (Test-Path $nvimExe)) {
            throw "Neovim executable was not found: $nvimExe"
          }
          $nvimBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nvimExe --version

      - name: Build, test, package, and smoke-test Windows bundle
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $artifactDir = Join-Path $root '.cache\artifacts\windows-x86_64'
          $rimeBuildDir = Join-Path $root '.cache\rime-build\windows-x86_64'
          $runtimeDir = Join-Path $artifactDir 'rime-runtime'
          $bundleDir = Join-Path $artifactDir 'nvim-gpui'
          $installerDir = Join-Path $artifactDir 'installer'
          New-Item -ItemType Directory -Force -Path $artifactDir, $rimeBuildDir | Out-Null

          $env:NVIM_GPUI_RIME_WINDOWS_ARCH = 'x64'
          $env:NVIM_GPUI_RIME_BUILD_DIR = $rimeBuildDir
          $env:NVIM_GPUI_RIME_RUNTIME_OUTPUT = $runtimeDir
          $env:NVIM_GPUI_WINDOWS_BUNDLE_OUTPUT = $bundleDir
          $env:NVIM_GPUI_WINDOWS_INSTALLER_OUTPUT = $installerDir

          just pack-windows

          $zip = Join-Path $root "nvim-gpui-$env:GITHUB_REF_NAME-windows-x86_64.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path (Join-Path $bundleDir '*') -DestinationPath $zip

          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $installer = Join-Path $installerDir "nvim-gpui-$version-setup.exe"
          if (-not (Test-Path $installer)) {
            throw "Windows installer was not created: $installer"
          }
          $releaseInstaller = Join-Path $root "nvim-gpui-$env:GITHUB_REF_NAME-windows-x86_64-setup.exe"
          Copy-Item $installer $releaseInstaller -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: nvim-gpui-${{ github.ref_name }}-windows-x86_64
          path: |
            nvim-gpui-${{ github.ref_name }}-windows-x86_64.zip
            nvim-gpui-${{ github.ref_name }}-windows-x86_64-setup.exe
          if-no-files-found: error

  publish:
    name: Publish release packages
    needs: [macos, linux, windows]
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: nvim-gpui-${{ github.ref_name }}-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py notes "$GITHUB_REF_NAME" > release-notes.md
          assets=(
            "nvim-gpui-${GITHUB_REF_NAME}-darwin-aarch64.dmg"
            "nvim-gpui-${GITHUB_REF_NAME}-darwin-x86_64.dmg"
            "nvim-gpui-${GITHUB_REF_NAME}-darwin-aarch64.app.zip"
            "nvim-gpui-${GITHUB_REF_NAME}-darwin-x86_64.app.zip"
            "nvim-gpui-${GITHUB_REF_NAME}-linux-aarch64.deb"
            "nvim-gpui-${GITHUB_REF_NAME}-linux-x86_64.deb"
            "nvim-gpui-${GITHUB_REF_NAME}-windows-x86_64.zip"
            "nvim-gpui-${GITHUB_REF_NAME}-windows-x86_64-setup.exe"
          )
          shasum -a 256 "${assets[@]}" > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
