name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in
            arm64) actual_arch="aarch64" ;;
            x86_64) actual_arch="x86_64" ;;
            *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          test "$actual_arch" = "$EXPECTED_ARCH"

      - name: Build AppBundle and DMG
        run: nix develop --accept-flake-config -c just dmg

      - name: Archive AppBundle
        env:
          ARCH: ${{ matrix.arch }}
        run: ditto -c -k --sequesterRsrc --keepParent ".cache/macos/nvim-gpui.app" ".cache/macos/nvim-gpui-${ARCH}.app.zip"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: nvim-gpui-${{ github.ref_name }}-${{ matrix.arch }}
          path: |
            .cache/macos/nvim-gpui-${{ matrix.arch }}.dmg
            .cache/macos/nvim-gpui-${{ matrix.arch }}.app.zip
          if-no-files-found: error
          include-hidden-files: true

  publish:
    name: Publish macOS packages
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: nvim-gpui-${{ github.ref_name }}-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            nvim-gpui-aarch64.dmg \
            nvim-gpui-x86_64.dmg \
            nvim-gpui-aarch64.app.zip \
            nvim-gpui-x86_64.app.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
