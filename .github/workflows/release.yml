name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            nix_system: aarch64-darwin
          - arch: x86_64
            # Determinate Nix no longer installs on Intel macOS. Build the
            # Intel artifact on Apple Silicon and let macOS/Rosetta execute
            # any x86_64 tools that are needed during the build.
            runner: macos-15
            nix_system: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release metadata
        run: python3 scripts/release.py check "$GITHUB_REF_NAME"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"

      - name: Enable Rosetta 2 for Intel tools
        if: matrix.arch == 'x86_64'
        run: sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license

      - name: Build AppBundle and DMG
        run: nix develop --accept-flake-config ".#devShells.${{ matrix.nix_system }}.default" -c bash -lc 'just rime-runtime-macos && just dmg'

      - name: Archive AppBundle
        env:
          ARCH: ${{ matrix.arch }}
        run: ditto -c -k --sequesterRsrc --keepParent ".cache/macos/nvim-gpui.app" ".cache/macos/nvim-gpui-${ARCH}.app.zip"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: nvim-gpui-${{ github.ref_name }}-${{ matrix.arch }}
          path: |
            .cache/macos/nvim-gpui-${{ matrix.arch }}.dmg
            .cache/macos/nvim-gpui-${{ matrix.arch }}.app.zip
          if-no-files-found: error
          include-hidden-files: true

  publish:
    name: Publish macOS packages
    needs: build
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: nvim-gpui-${{ github.ref_name }}-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py notes "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            nvim-gpui-aarch64.dmg \
            nvim-gpui-x86_64.dmg \
            nvim-gpui-aarch64.app.zip \
            nvim-gpui-x86_64.app.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
