name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            nix_system: aarch64-darwin
          - arch: x86_64
            # Determinate Nix no longer installs on Intel macOS. Build the
            # Intel artifact on Apple Silicon and let macOS/Rosetta execute
            # any x86_64 tools that are needed during the build.
            runner: macos-15
            nix_system: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release metadata
        run: python3 scripts/release.py check "$GITHUB_REF_NAME"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"

      - name: Enable Rosetta 2 for Intel tools
        if: matrix.arch == 'x86_64'
        run: sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license

      - name: Build macOS Rime runtime
        run: nix develop --accept-flake-config ".#devShells.${{ matrix.nix_system }}.default" -c just rime-runtime-macos

      - name: Share curated Rime starter data with Windows build
        if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: rime-starter-data
          path: .cache/rime-runtime/data/.
          if-no-files-found: error

      - name: Build AppBundle and DMG
        run: nix develop --accept-flake-config ".#devShells.${{ matrix.nix_system }}.default" -c just dmg

      - name: Archive AppBundle
        env:
          ARCH: ${{ matrix.arch }}
        run: ditto -c -k --sequesterRsrc --keepParent ".cache/macos/nvim-gpui.app" ".cache/macos/nvim-gpui-${ARCH}.app.zip"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: nvim-gpui-${{ github.ref_name }}-${{ matrix.arch }}
          path: |
            .cache/macos/nvim-gpui-${{ matrix.arch }}.dmg
            .cache/macos/nvim-gpui-${{ matrix.arch }}.app.zip
          if-no-files-found: error
          include-hidden-files: true

  windows:
    name: Windows package
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Boost download tools
        shell: pwsh
        run: choco install aria2 7zip --no-progress -y

      - name: Download curated Rime starter data
        uses: actions/download-artifact@v4
        with:
          name: rime-starter-data
          path: .cache/rime-starter-data

      - name: Build Windows Rime runtime
        shell: pwsh
        run: |
          $defaultSchema = Get-ChildItem -Path .cache/rime-starter-data -Recurse -Filter default.yaml -File | Select-Object -First 1
          if (-not $defaultSchema) {
            throw "curated Rime starter data was not downloaded"
          }
          & .\packaging\rime\build-windows.ps1 -DataSource $defaultSchema.Directory.FullName

      - name: Build Windows directory bundle
        shell: pwsh
        run: |
          & .\packaging\windows\bundle.ps1

      - name: Archive Windows bundle
        shell: pwsh
        run: Compress-Archive -Path .cache\windows\nvim-gpui -DestinationPath .cache\nvim-gpui-windows.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: nvim-gpui-${{ github.ref_name }}-windows
          path: .cache/nvim-gpui-windows.zip
          if-no-files-found: error

  publish:
    name: Publish release packages
    needs: [build, windows]
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: nvim-gpui-${{ github.ref_name }}-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py notes "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            nvim-gpui-aarch64.dmg \
            nvim-gpui-x86_64.dmg \
            nvim-gpui-aarch64.app.zip \
            nvim-gpui-x86_64.app.zip \
            nvim-gpui-windows.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
