[package]
name = "nvim-gpui"
version = "0.3.0"
edition = "2021"
description = "A GPUI-based graphical frontend for Neovim"
license = "MIT"
repository = "https://github.com/imkerberos/nvim-gpui"
publish = false

[dependencies]
base64 = "0.22.1"
async-channel = "2.5.0"
flexi_logger = { version = "0.31.10", default-features = false, features = ["async"] }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
log = "0.4.34"
rmpv = "1.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24.0", default-features = false, features = ["link"] }
foreign-types = "0.5.0"
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[profile.dev]
debug = 1
